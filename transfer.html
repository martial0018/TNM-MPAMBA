<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mpamba Transfer</title>
  <style>
    :root {
      --green: #00a651;
      --green-deep: #073d25;
      --paper: #f4faf7;
      --ink: #10251b;
      --muted: #5f756b;
      --line: #dfece4;
      --orange: #ff6600;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f4faf7, #edf9f1);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .card {
      width: min(100%, 430px);
      background: var(--white);
      border: 1px solid rgba(7,61,37,.08);
      border-radius: 24px;
      box-shadow: 0 20px 55px rgba(7,61,37,.08);
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.9);
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 54px;
      height: 32px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .content { padding: 20px 18px 18px; }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--green-deep);
    }
    .subtitle { margin: 0 0 18px; font-size: 14px; color: var(--muted); }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
      background: #fafdfb;
      color: var(--ink);
    }
    input:focus, select:focus {
      border-color: rgba(0,166,81,.6);
      box-shadow: 0 0 0 4px rgba(0,166,81,.08);
    }
    .phone-wrap {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fafdfb;
    }
    .country-prefix {
      background: #f2f8f4;
      border-right: 1px solid var(--line);
      padding: 13px 12px;
      font-weight: 700;
      color: var(--green-deep);
    }
    .phone-wrap input {
      border: 0;
      border-radius: 0;
      background: transparent;
      flex: 1;
    }
    .amount-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .amount-row input { width: 100%; }
    .currency {
      display: grid;
      place-items: center;
      min-width: 56px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8fdfb;
      color: var(--green-deep);
      font-weight: 700;
    }
    .cta {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--green), #0a9d4f);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .ghost {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--green-deep);
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/images/mpamba_logo_transparent.png" alt="Mpamba logo" /></div>
        <span>Mpamba</span>
      </div>
      <span style="color: var(--orange);">Transfer</span>
    </div>
    <div class="content">
      <h1>Send money</h1>
      <p class="subtitle">Enter the recipient details and choose the network before continuing.</p>

      <div class="field">
        <label for="network">Network</label>
        <select id="network">
          <option value="TNM">TNM</option>
          <option value="Airtel">Airtel</option>
        </select>
      </div>

      <div class="field">
        <label for="recipient">Recipient mobile number</label>
        <div class="phone-wrap">
          <span class="country-prefix">🇲🇼 +265</span>
          <input id="recipient" type="tel" value="888123456" inputmode="tel" />
        </div>
      </div>

      <div class="field">
        <label for="amount">Amount (MWK)</label>
        <div class="amount-row">
          <input id="amount" type="number" min="1" value="1000" />
          <div class="currency">MWK</div>
        </div>
      </div>

      <button id="continue" class="cta" type="button">Continue</button>
      <button id="back" class="ghost" type="button">Back</button>
    </div>
  </div>

  <script>
    const money = n => 'MWK ' + Number(n).toLocaleString('en-US');
    const parseBalance = () => Number(localStorage.getItem('tnmBalance') || 50000);

    document.getElementById('continue').addEventListener('click', () => {
      const network = document.getElementById('network').value;
      const recipient = document.getElementById('recipient').value.trim().replace(/\D/g, '');
      const amount = Number(document.getElementById('amount').value);

      if (!recipient || !/^\d{9}$/.test(recipient)) {
        alert('Enter a valid 9-digit Malawi mobile number.');
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        alert('Enter a valid transfer amount.');
        return;
      }
      if (parseBalance() < amount) {
        alert('Insufficient balance.');
        return;
      }

      const params = new URLSearchParams({
        network,
        recipient,
        amount: String(amount)
      });

      window.location.href = 'transfer-pin.html?' + params.toString();
    });

    document.getElementById('back').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
